[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]

[tool.setuptools.packages.find]
include = ["pgqueuer*"]

[tool.setuptools.package-data]
"pgqueuer.adapters.web" = ["templates/**/*.html", "static/*"]

[tool.setuptools_scm]
version_scheme= "only-version"
local_scheme= "no-local-version"
write_to= "pgqueuer/_version.py"


[project]
name = "pgqueuer"
description = "PostgreSQL-backed background job and task queue for Python."
authors = [{name = "JeyBee"}]
license = {text = "MIT License"}
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["postgresql", "task-queue", "job-queue", "background-jobs", "asyncio"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "anyio>=4.0",
    "croniter>=5.0.1",
    "pydantic-settings>=2.6.1",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
    "typer>=0.15.1",
    "uvloop>=0.22.0; sys_platform != 'win32'",
]

[project.urls]
Documentation = "https://janbjorge.github.io/pgqueuer/"
Homepage = "https://github.com/janbjorge/pgqueuer/"
Issues = "https://github.com/janbjorge/pgqueuer/issues"
Repository = "https://github.com/janbjorge/pgqueuer/"

[project.scripts]
pgq = "pgqueuer.__main__:main"

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.30.0"]
psycopg = ["psycopg>=3.2.0", "psycopg-pool>=3.2"]
logfire = ["logfire>=3.0.0"]
sentry = ["sentry-sdk>=2.0.0"]
opentelemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-semantic-conventions>=0.41b0",
]
fastapi = ["fastapi>=0.100.0"]
mcp = ["mcp>=1.0", "asyncpg>=0.30.0"]
web = ["fastapi>=0.115.0", "jinja2>=3.1", "uvicorn>=0.30"]

[dependency-groups]
test = [
    "pgqueuer[asyncpg,psycopg,logfire,sentry,opentelemetry,fastapi,mcp,web]",
    "flask",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "testcontainers>=4.14.2",
    "time-machine>=2.16.0",
]
lint = [
    "asyncpg-stubs",
    "import-linter>=2.0",
    "mypy",
    "ruff",
    "types-croniter",
    "types-tabulate",
    "types-tqdm",
]
bench = [
    "pgqueuer[asyncpg,psycopg]",
    # Benchmark psycopg with its C libpq wrapper; users choose their own impl.
    "psycopg[binary]",
    "tqdm",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-redirects",
    "pymdown-extensions",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "bench" },
    { include-group = "docs" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",  # conflict with ruff format
    "D1",  # missing docstrings; follow-up, starting with D100/D104
    "D203", "D213",  # pick D211/D212
    "TC001", "TC002", "TC003",  # pydantic and dataclasses need runtime annotations
    "TRY003", "EM101", "EM102",  # message strings in raise
    "FBT001", "FBT002", "FBT003",  # boolean args are public API
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # C901 already caps complexity
    "ARG002",  # unused args in Protocol/port implementations
    "A002",  # `id`/`type` kwargs are public API
    "RUF001", "RUF002",  # intentional unicode in UI strings
    "S608",  # SQL built from validated identifiers (qb.py); values are bind params
    "TC006",  # quoted cast types only help with TYPE_CHECKING imports; TC001-TC003 are ignored
    "CPY", "ERA", "TD", "FIX",
    # Temporary: rules with open violations, fixed and removed per PR (#1048).
    "ANN001", "ANN204", "ARG001", "ASYNC109", "ASYNC110", "ASYNC230", "B004", "B007", "B008",
    "B017", "B023", "B905", "BLE001", "D205", "D415", "DTZ005", "FAST002", "N802", "N803",
    "N812", "N818", "PERF102", "PGH004", "PLR1714", "PLW0603", "PT003", "PT006",
    "PT007", "PT011", "PT012", "PT018", "PT028", "PTH109", "PTH123", "PYI034", "RUF005",
    "RUF009", "RUF012", "RUF043", "RUF059", "S101", "S104", "S105", "S110", "S311", "S603",
    "SLF001", "TRY002", "TRY004", "TRY301",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101", "ARG001", "SLF001", "PLC0415", "INP001", "ANN401", "N803", "N806", "D"]
"pgqueuer/adapters/cli/**" = ["T201"]
# Optional extras: importing these at module level would make every install need them.
"pgqueuer/adapters/connections.py" = ["PLC0415"]
"pgqueuer/adapters/drivers/psycopg.py" = ["PLC0415"]
"examples/**" = ["T201", "INP001"]
"tools/**" = ["T201", "INP001"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
combine-as-imports = true
relative-imports-order = "furthest-to-closest"
force-single-line = false

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
exclude = "^(build)"
ignore_missing_imports = true
explicit_package_bases = true
warn_unreachable = true
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "unused-awaitable",
    "possibly-undefined",
    "ignore-without-code",
]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
module = "pgqueuer.*"
disallow_any_explicit = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["tools.*", "examples.*"]
disallow_any_explicit = true
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = "test.*"
disable_error_code = ["method-assign"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = "20"
timeout_func_only = true
# -n 2: modest parallelism; each xdist worker gets its own session-scoped
# Postgres container, so this scales the suite across a few extra servers.
# Dropped from 4 after CI instability (see 9d9ce3c).
addopts = "--durations=15 -n 2"

# ---------------------------------------------------------------------------
# Import-linter: enforce hexagonal architecture boundaries
#
# Layer dependency rules (→ = "may import from"):
#   domain  → (nothing)
#   ports   → domain
#   core    → domain, ports
#   adapters → domain, ports, core
#   metrics → domain, ports  (presentation layer, no core or adapter deps)
#
# The sole exception is core.applications — the composition root that wires
# concrete adapters into the core.  All 4 allowed imports are listed below.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["pgqueuer"]

[[tool.importlinter.contracts]]
name = "Domain must not import from adapters, core, or metrics"
type = "forbidden"
source_modules = ["pgqueuer.domain"]
forbidden_modules = ["pgqueuer.adapters", "pgqueuer.core", "pgqueuer.metrics"]

[[tool.importlinter.contracts]]
name = "Ports must not import from adapters, core, or metrics"
type = "forbidden"
source_modules = ["pgqueuer.ports"]
forbidden_modules = ["pgqueuer.adapters", "pgqueuer.core", "pgqueuer.metrics"]

[[tool.importlinter.contracts]]
name = "Core must not import from adapters or metrics"
type = "forbidden"
source_modules = ["pgqueuer.core"]
forbidden_modules = ["pgqueuer.adapters", "pgqueuer.metrics"]
ignore_imports = [
    # applications.py is the composition root — it wires concrete adapters.
    "pgqueuer.core.applications -> pgqueuer.adapters.drivers.asyncpg",
    "pgqueuer.core.applications -> pgqueuer.adapters.drivers.psycopg",
    "pgqueuer.core.applications -> pgqueuer.adapters.persistence.queries",
    "pgqueuer.core.applications -> pgqueuer.adapters.inmemory",
]

[[tool.importlinter.contracts]]
name = "Metrics must not import from adapters or core"
type = "forbidden"
source_modules = ["pgqueuer.metrics"]
forbidden_modules = ["pgqueuer.adapters", "pgqueuer.core"]
