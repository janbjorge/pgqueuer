name: Publish Python distribution to PyPI
on:
  release:
    types: [created]
jobs:
  publish-pypi-package:
    name: Publish Python distribution to PyPI.
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/pgqueuer/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures tags are also fetched
      - name: Set up Python 3.10.
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install release dependencies.
        run: python3 -m pip install build twine setuptools_scm
      - name: Build package.
        run: python3 -m build . --sdist --wheel --outdir dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker-images:
    name: Publish ${{ matrix.name }} Docker image.
    needs: publish-pypi-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: prometheus
            dockerfile: tools/prometheus/Dockerfile
          - name: web
            dockerfile: tools/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pgqueuer version.
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PGQUEUER_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
